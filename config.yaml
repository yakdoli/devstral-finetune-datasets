# Unsloth 데이터셋 생성 설정 파일

# 프로젝트 설정
project_name: "Syncfusion WinForms Unsloth Dataset"
project_version: "1.0.0"
target_count: 5000
output_directory: "./output/datasets"

# 로컬 LLM API 설정
local_llm:
  endpoint: "http://123.37.28.120:9997/v1"
  model: "qwen2.5-vl-instruct"
  max_tokens: 128000
  temperature: 0.3
  top_p: 0.9
  frequency_penalty: 0.0
  presence_penalty: 0.0
  batch_size: 16
  max_concurrent_requests: 8
  request_timeout: 60
  retry_attempts: 3
  retry_delay: 1.0

# Qdrant 설정
qdrant_host: "100.100.88.88"
qdrant_port: 6333
qdrant_collection: "ws-7491d651ae044c78"

# Context7 설정
context7:
  enable: true
  library_id: "/yakdoli/syncfusion-v11-winform"
  endpoint: null
  timeout: 30
  max_results: 10
  use_in_prompt: true
  
  # 하이브리드 검색 가중치
  weights:
    context7: 0.3
    local: 0.3
    qdrant: 0.4

# 데이터 소스 설정
md_output_path: "./output"
md_staging_path: "./md_staging"

# Unsloth 설정
max_seq_length: 8192
formats: ["sharegpt", "alpaca", "openai"]
train_test_split: 0.9

# 품질 검증 설정
min_quality_score: 0.7
max_similarity_threshold: 0.9
safety_threshold: 0.1
enable_auto_correction: true

# 실행 설정
test_mode: false
sample_size: 100
verbose: false
progress_bar: true
log_level: "INFO"
log_file: "dataset_generation.log"

# 단계별 실행 설정
steps:
  - "md_processing"
  - "qdrant_search"  # Qdrant 서버가 실행되지 않아 일시적으로 비활성화
  - "conversation_generation"
  - "dataset_generation"
  - "quality_validation"